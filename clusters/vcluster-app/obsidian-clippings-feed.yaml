apiVersion: v1
kind: Namespace
metadata:
  name: obsidian-clippings-feed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-clippings-feed
  namespace: obsidian-clippings-feed
  labels:
    app: obsidian-clippings-feed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obsidian-clippings-feed
  template:
    metadata:
      labels:
        app: obsidian-clippings-feed
    spec:
      containers:
        - name: obsidian-clippings-feed
          image: ghcr.io/nakatanakatana/obsidian-clippings-feed:latest@sha256:9275d4b487886d0ff920c6d4619554d4c34c15e2b36c19b40f4555b7696a4626
          imagePullPolicy: Always
          env:
            - name: FEED_TARGET_DIR
              value: /app/data
          volumeMounts:
            - name: data
              mountPath: /app/data
          ports:
            - containerPort: 8080
      initContainers:
        - name: livesync-bridge
          image: ghcr.io/nakatanakatana/livesync-bridge:latest@sha256:2b42edf37f804f2490285a090fa4f2f241ce4a5d782addeb20b10312429731c6
          imagePullPolicy: Always
          restartPolicy: Always
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: livesync-config
              mountPath: /app/dat
      volumes:
        - name: data
          emptyDir: {}
        - name: livesync-config
          secret:
            secretName: obsidian-secret
---
apiVersion: v1
kind: Service
metadata:
  name: obsidian-clippings-feed
  namespace: obsidian-clippings-feed
spec:
  type: ClusterIP
  selector:
    app: obsidian-clippings-feed
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: obsidian-clippings-feed
  namespace: obsidian-clippings-feed
spec:
  parentRefs:
    - name: cloudflare-app
      namespace: cloudflare-gateway
      sectionName: http
  hostnames:
    - clippings.nakatanakatana.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: obsidian-clippings-feed
          port: 8080
