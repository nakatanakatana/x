apiVersion: v1
kind: Namespace
metadata:
  name: obsidian-clippings-feed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-clippings-feed
  namespace: obsidian-clippings-feed
  labels:
    app: obsidian-clippings-feed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obsidian-clippings-feed
  template:
    metadata:
      labels:
        app: obsidian-clippings-feed
    spec:
      containers:
        - name: obsidian-clippings-feed
          image: ghcr.io/nakatanakatana/obsidian-clippings-feed:latest@sha256:b976f370410f7031c6deb3a53e8b28d8ec7d4b03a379f2772799000922503d16
          imagePullPolicy: Always
          env:
            - name: FEED_TARGET_DIR
              value: /app/data
          volumeMounts:
            - name: data
              mountPath: /app/data
          ports:
            - containerPort: 8080
      initContainers:
        - name: livesync-bridge
          image: ghcr.io/nakatanakatana/livesync-bridge:latest@sha256:a624c58ac156a2a98f4b362f00f7f21c5925f01d560941ca444f767fb31a5a00
          imagePullPolicy: Always
          restartPolicy: Always
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: livesync-config
              mountPath: /app/dat
      volumes:
        - name: data
          emptyDir: {}
        - name: livesync-config
          secret:
            secretName: obsidian-secret
---
apiVersion: v1
kind: Service
metadata:
  name: obsidian-clippings-feed
  namespace: obsidian-clippings-feed
spec:
  type: ClusterIP
  selector:
    app: obsidian-clippings-feed
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: obsidian-clippings-feed
  namespace: obsidian-clippings-feed
spec:
  parentRefs:
    - name: cloudflare-app
      namespace: cloudflare-gateway
      sectionName: http
  hostnames:
    - clippings.nakatanakatana.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: obsidian-clippings-feed
          port: 8080
