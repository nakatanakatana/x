apiVersion: v1
kind: ConfigMap
metadata:
  name: preview-auth-router-config
  namespace: preview-system
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr info;

    events {
      worker_connections 1024;
    }

    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      server {
        listen 8080;
        server_name auth.preview.nakatanakatana.app;

        location / {
          proxy_pass http://127.0.0.1:4180;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Scheme https;
          proxy_set_header X-Auth-Request-Redirect https://$host$request_uri;
        }
      }

      server {
        listen 8080;
        server_name ~^(?<preview_ns>[a-z0-9-]+)\.preview\.nakatanakatana\.app$;

        location = /oauth2/auth {
          internal;
          proxy_pass http://127.0.0.1:4180/oauth2/auth;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Scheme https;
          proxy_set_header Content-Length "";
          proxy_pass_request_body off;
        }

        location / {
          auth_request /oauth2/auth;
          error_page 401 =403 /oauth2/sign_in;

          auth_request_set $auth_user $upstream_http_x_auth_request_user;
          auth_request_set $auth_email $upstream_http_x_auth_request_email;
          proxy_set_header X-Forwarded-User $auth_user;
          proxy_set_header X-Forwarded-Email $auth_email;

          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;

          proxy_pass http://preview-http.$preview_ns.svc.cluster.local:8080;
        }

        location = /oauth2/sign_in {
          internal;
          return 302 https://auth.preview.nakatanakatana.app/oauth2/start?rd=https://$host$request_uri;
        }
      }
    }
