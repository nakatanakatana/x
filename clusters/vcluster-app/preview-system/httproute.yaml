apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: preview-auth-callback
  namespace: preview-system
spec:
  parentRefs:
    - name: cloudflare-app
      namespace: cloudflare-gateway
      sectionName: http
  hostnames:
    - auth.preview.nakatanakatana.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: preview-auth-proxy
          port: 8080
