apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-auth-proxy
  namespace: preview-system
  labels:
    app: preview-auth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-auth-proxy
  template:
    metadata:
      labels:
        app: preview-auth-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.nakatanakatana.app
            - --redirect-url=https://preview-auth.nakatanakatana.app/oauth2/callback
            - --cookie-domain=.nakatanakatana.app
            - --whitelist-domain=.nakatanakatana.app
            - --whitelist-domain=*.nakatanakatana.app
            - --email-domain=*
            - --insecure-oidc-allow-unverified-email=true
            - --http-address=127.0.0.1:4180
            - --upstream=static://202
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --cookie-secure=true
            - --cookie-samesite=lax
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: preview-pocket-id
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: preview-pocket-id
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: preview-pocket-id
                  key: cookie-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: oauth2
              containerPort: 4180
        - name: router
          image: nginx:1.31.10@sha256:a786635fd3c7b9a57ea089ab1c0713e510f3b548b65fe699ce3d59e4a926b37e
          args:
            - nginx
            - -c
            - /etc/nginx/nginx.conf
            - -g
            - daemon off;
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: preview-auth-router-config
        - name: tmp
          emptyDir: {}
