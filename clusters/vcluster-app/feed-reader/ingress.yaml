apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feed-reader
  namespace: feed-reader
  annotations:
    tailscale.com/proxy-group: "ingress-proxies"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: feed-reader
      port:
        number: 8080
  tls:
    - hosts:
        - feed-reader
