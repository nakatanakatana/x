apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: feed-reader-data
  namespace: feed-reader
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: rook-ceph-block
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-reader
  namespace: feed-reader
  labels:
    app: feed-reader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: feed-reader
  template:
    metadata:
      annotations:
        litestream.mytools.nakatanakatana.app/inject: feed-reader-db
        litestream.mytools.nakatanakatana.app/target-container: feed-reader
        litestream.mytools.nakatanakatana.app/volume: data
      labels:
        app: feed-reader
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: feed-reader
          image: ghcr.io/nakatanakatana/feed-reader:0.25.0@sha256:f5978e1fb83ca1a35999d4c398b3dd7f6478c738af1f945aeb83e3351400110f
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: https://nakatanakatana.cloudflareaccess.com
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: feed-reader-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: feed-reader
  namespace: feed-reader
spec:
  type: ClusterIP
  selector:
    app: feed-reader
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: feed-reader
  namespace: feed-reader
spec:
  parentRefs:
    - name: cloudflare-app
      namespace: cloudflare-gateway
      sectionName: http
  hostnames:
    - feed.nakatanakatana.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: feed-reader
          port: 8080
