apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: feed-reader-data
  namespace: feed-reader
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: rook-ceph-block
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-reader
  namespace: feed-reader
  labels:
    app: feed-reader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: feed-reader
  template:
    metadata:
      labels:
        app: feed-reader
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-litestream
          image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - restore
            - -if-db-not-exists
            - -if-replica-exists
            - /data/feed-reader.db
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: feed-reader-storage
                  key: access_key
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: feed-reader-storage
                  key: access_secret
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
      containers:
        - name: feed-reader
          image: ghcr.io/nakatanakatana/feed-reader:0.24.0@sha256:eceff6344d619c5362b4e75e8712a2bbb1caa6ba3a78eb2c75eb0c2ab5274c39
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: https://nakatanakatana.cloudflareaccess.com
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
        - name: litestream
          image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - replicate
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: feed-reader-storage
                  key: access_key
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: feed-reader-storage
                  key: access_secret
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: feed-reader-data
        - name: tmp
          emptyDir: {}
        - name: litestream-config
          configMap:
            name: feed-reader-litestream
---
apiVersion: v1
kind: Service
metadata:
  name: feed-reader
  namespace: feed-reader
spec:
  type: ClusterIP
  selector:
    app: feed-reader
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: feed-reader
  namespace: feed-reader
spec:
  parentRefs:
    - name: cloudflare-app
      namespace: cloudflare-gateway
      sectionName: http
  hostnames:
    - feed.nakatanakatana.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: feed-reader
          port: 8080
