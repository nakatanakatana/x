apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: sandbox
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: ssh://git@github.com/nakatanakatana/x
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sandbox
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/sandbox
  prune: true
  sourceRef:
    kind: GitRepository
    name: sandbox
