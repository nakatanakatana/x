apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-pac-webhook
  namespace: tekton-pipelines
spec:
  parentRefs:
    - name: cloudflare-ci
      namespace: cloudflare-gateway
      sectionName: http
  hostnames:
    - ci-webhook.nakatanakatana.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pipelines-as-code-controller
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: tekton-dashboard
      port:
        number: 9097
  tls:
    - hosts:
        - ci
