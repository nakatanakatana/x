apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagent-home-viewer
  namespace: agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagent-home-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kagent-home-viewer
    namespace: agent
---
apiVersion: v1
kind: Secret
metadata:
  name: kagent-home-viewer-token
  namespace: agent
  annotations:
    kubernetes.io/service-account.name: kagent-home-viewer
type: kubernetes.io/service-account-token
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent-crds
  namespace: agent
spec:
  interval: 1h0m0s
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: extract
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds
  ref:
    tag: 0.10.6
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent
  namespace: agent
spec:
  interval: 1h0m0s
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: extract
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent
  ref:
    tag: 0.10.6
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent-tools
  namespace: agent
spec:
  interval: 1h0m0s
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: extract
  url: oci://ghcr.io/kagent-dev/tools/helm/kagent-tools
  ref:
    tag: 0.3.1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
  namespace: agent
spec:
  interval: 10m
  timeout: 5m
  kubeConfig:
    secretRef:
      name: vc-vcluster
      key: config
  targetNamespace: kagent
  storageNamespace: kagent
  releaseName: kagent-crds
  chartRef:
    kind: OCIRepository
    name: kagent-crds
    namespace: agent
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: agent
spec:
  interval: 10m
  timeout: 10m
  dependsOn:
    - name: kagent-crds
      namespace: agent
  kubeConfig:
    secretRef:
      name: vc-vcluster
      key: config
  targetNamespace: kagent
  storageNamespace: kagent
  releaseName: kagent
  chartRef:
    kind: OCIRepository
    name: kagent
    namespace: agent
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        model: deepseek-v4.1-flash
        apiKeySecretRef: kagent-bifrost-auth
        apiKeySecretKey: OPENAI_API_KEY
        config:
          baseUrl: "http://bifrost.proxy.svc.cluster.local:8080/openai/v1"
    kagent-tools:
      enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-tools-app
  namespace: agent
spec:
  interval: 10m
  timeout: 5m
  dependsOn:
    - name: kagent-crds
      namespace: agent
  kubeConfig:
    secretRef:
      name: vc-vcluster
      key: config
  targetNamespace: kagent
  storageNamespace: kagent
  releaseName: kagent-tools-app
  chartRef:
    kind: OCIRepository
    name: kagent-tools
    namespace: agent
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: kagent-tools-app
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kagent-tools-app
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kagent-tools-app
              spec:
                template:
                  spec:
                    containers:
                      - name: kagent-tools
                        args:
                          - --port
                          - "8084"
                          - --kubeconfig
                          - /kubeconfig/config
                        volumeMounts:
                          - name: kubeconfig
                            mountPath: /kubeconfig
                            readOnly: true
                    volumes:
                      - name: kubeconfig
                        secret:
                          secretName: vcluster-app-kubeconfig
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-tools-home-ro
  namespace: agent
spec:
  interval: 10m
  timeout: 5m
  dependsOn:
    - name: kagent-crds
      namespace: agent
  kubeConfig:
    secretRef:
      name: vc-vcluster
      key: config
  targetNamespace: kagent
  storageNamespace: kagent
  releaseName: kagent-tools-home-ro
  chartRef:
    kind: OCIRepository
    name: kagent-tools
    namespace: agent
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: kagent-tools-home-ro
    rbac:
      readOnly: true
      allowSecrets: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kagent-tools-home-ro
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kagent-tools-home-ro
              spec:
                template:
                  spec:
                    containers:
                      - name: kagent-tools
                        args:
                          - --port
                          - "8084"
                          - --read-only
                          - --kubeconfig
                          - /kubeconfig/config
                        volumeMounts:
                          - name: kubeconfig
                            mountPath: /kubeconfig
                            readOnly: true
                          - name: home-token
                            mountPath: /var/run/secrets/home-cluster
                            readOnly: true
                    volumes:
                      - name: kubeconfig
                        configMap:
                          name: home-cluster-viewer-kubeconfig
                      - name: home-token
                        secret:
                          secretName: home-cluster-viewer-token
