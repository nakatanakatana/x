apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: neon-demo
  namespace: database
spec:
  clusterDef: neon
  topology: default
  terminationPolicy: Delete
  schedulingPolicy:
    nodeSelector:
      kubernetes.io/arch: amd64
  componentSpecs:
    - name: neon-pageserver
      componentDef: neon-pageserver-1.0.1
      serviceVersion: 1.0.0
      replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: rook-ceph-block
            resources:
              requests:
                storage: 10Gi
    - name: neon-safekeeper
      componentDef: neon-safekeeper-1.0.1
      serviceVersion: 1.0.0
      replicas: 3
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: rook-ceph-block
            resources:
              requests:
                storage: 5Gi
    - name: neon-broker
      componentDef: neon-broker-1.0.1
      serviceVersion: 1.0.0
      replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
    - name: neon-compute
      componentDef: neon-compute-1.0.1
      serviceVersion: 1.0.0
      replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: rook-ceph-block
            resources:
              requests:
                storage: 5Gi
