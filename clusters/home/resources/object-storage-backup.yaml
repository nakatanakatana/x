apiVersion: v1
kind: ConfigMap
metadata:
  name: object-storage-backup-script
  namespace: app
data:
  backup.sh: |
    #!/bin/sh
    set -eu

    : "${OBJECT_STORAGE_BACKUP_DRY_RUN:=false}"
    case "${OBJECT_STORAGE_BACKUP_DRY_RUN}" in
      true|false) ;;
      *)
        echo "OBJECT_STORAGE_BACKUP_DRY_RUN must be true or false" >&2
        exit 2
        ;;
    esac

    if [ "${OBJECT_STORAGE_BACKUP_DRY_RUN}" = "true" ]; then
      rclone mkdir --dry-run pcloud:s3-backups
    else
      rclone mkdir pcloud:s3-backups
    fi

    backup() {
      source="$1"
      destination="$2"
      listing="$3"

      if ! rclone lsf --recursive --files-only "${source}" >"${listing}"; then
        echo "failed to list ${source}" >&2
        return 1
      fi
      if [ ! -s "${listing}" ]; then
        echo "refusing to sync empty source ${source}" >&2
        return 1
      fi
      listing_objects=$(wc -l <"${listing}")
      listing_bytes=$(wc -c <"${listing}")
      printf 'source=%s listing_objects=%s listing_bytes=%s\n' \
        "${source}" "${listing_objects}" "${listing_bytes}"

      if [ "${OBJECT_STORAGE_BACKUP_DRY_RUN}" = "true" ]; then
        if ! rclone sync --checksum --delete-after --delete-excluded --max-delete 1000 --max-delete-size 10GiB --files-from-raw "${listing}" --dry-run "${source}" "${destination}"; then
          echo "sync failed for ${source}" >&2
          return 1
        fi
        return 0
      fi

      if ! rclone sync --checksum --delete-after --delete-excluded --max-delete 1000 --max-delete-size 10GiB --files-from-raw "${listing}" "${source}" "${destination}"; then
        echo "sync failed for ${source}" >&2
        return 1
      fi
      sleep 10
      if ! rclone check "${source}" "${destination}" --checksum --files-from-raw "${listing}" --one-way; then
        echo "check failed for ${source}" >&2
        return 1
      fi
    }

    failed_sources=0
    backup celld:celld pcloud:s3-backups/celld /tmp/celld-files || failed_sources=1
    backup feedreader:feed-reader pcloud:s3-backups/feed-reader /tmp/feed-reader-files || failed_sources=1
    backup nostr:nostr pcloud:s3-backups/nostr /tmp/nostr-files || failed_sources=1
    if [ "${failed_sources}" -ne 0 ]; then
      echo "one or more sources failed" >&2
      exit 1
    fi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: object-storage-backup
  namespace: app
spec:
  schedule: "0 * * * *"
  suspend: false
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: object-storage-backup
    spec:
      activeDeadlineSeconds: 3300
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1009
            runAsGroup: 1009
            fsGroup: 1009
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rclone
              image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              command:
                - /bin/sh
                - /scripts/backup.sh
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 64Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
                  ephemeral-storage: 1Gi
              env:
                - name: OBJECT_STORAGE_BACKUP_DRY_RUN
                  value: "false"
                - name: HOME
                  value: /tmp
                - name: XDG_CONFIG_HOME
                  value: /tmp/.config
                - name: XDG_CACHE_HOME
                  value: /tmp/.cache
                - name: RCLONE_CONFIG_CELLD_TYPE
                  value: s3
                - name: RCLONE_CONFIG_CELLD_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_CELLD_ENDPOINT
                  value: http://rook-ceph-rgw-celld.rook-ceph.svc.cluster.local:80
                - name: RCLONE_CONFIG_CELLD_REGION
                  value: us-east-1
                - name: RCLONE_CONFIG_CELLD_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_CELLD_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: celld-storage
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_CELLD_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: celld-storage
                      key: AWS_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_FEEDREADER_TYPE
                  value: s3
                - name: RCLONE_CONFIG_FEEDREADER_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_FEEDREADER_ENDPOINT
                  value: http://storage-clusterip.tailscale.svc.cluster.local:8010
                - name: RCLONE_CONFIG_FEEDREADER_REGION
                  value: us-east-1
                - name: RCLONE_CONFIG_FEEDREADER_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_FEEDREADER_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: feed-reader-storage
                      key: access_key
                - name: RCLONE_CONFIG_FEEDREADER_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: feed-reader-storage
                      key: access_secret
                - name: RCLONE_CONFIG_NOSTR_TYPE
                  value: s3
                - name: RCLONE_CONFIG_NOSTR_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_NOSTR_ENDPOINT
                  value: http://storage-clusterip.tailscale.svc.cluster.local:8010
                - name: RCLONE_CONFIG_NOSTR_REGION
                  value: us-east-1
                - name: RCLONE_CONFIG_NOSTR_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_NOSTR_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: nostr-storage
                      key: access-key-id
                - name: RCLONE_CONFIG_NOSTR_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: nostr-storage
                      key: secret-access-key
                - name: RCLONE_CONFIG_PCLOUD_TYPE
                  value: s3
                - name: RCLONE_CONFIG_PCLOUD_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_PCLOUD_ENDPOINT
                  value: http://gateway.pcloud-s3.svc.cluster.local:8080
                - name: RCLONE_CONFIG_PCLOUD_REGION
                  value: us-east-1
                - name: RCLONE_CONFIG_PCLOUD_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_PCLOUD_UPLOAD_CUTOFF
                  value: 5GiB
                - name: RCLONE_CONFIG_PCLOUD_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: object-storage-backup-credentials
                      key: S3_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_PCLOUD_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: object-storage-backup-credentials
                      key: S3_SECRET_ACCESS_KEY
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: object-storage-backup-script
                defaultMode: 0555
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
