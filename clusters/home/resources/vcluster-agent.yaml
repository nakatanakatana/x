apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vcluster-agent
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: agent
  path: "components/vcluster/base"
  prune: true
  timeout: 1m
  patches:
    - target:
        kind: HelmRelease
        name: vcluster
      patch: |
        - op: add
          path: /spec/values
          value:
            controlPlane:
              service:
                annotations:
                  tailscale.com/expose: "true"
                  tailscale.com/hostname: "vcluster-agent"
            exportKubeConfig:
              server: "https://vcluster.agent.svc.cluster.local:443"
            policies:
              resourceQuota:
                quota:
                  requests.cpu: 4
                  requests.memory: 20Gi
                  count/pods: 40
                  count/services: 30
            networking:
              replicateServices:
                fromHost:
                  - from: monitoring/grafana-mcp-internal
                    to: kagent/grafana-mcp
                  - from: app/vcluster
                    to: app/vcluster
                  - from: default/kubernetes
                    to: kagent/home-kubernetes
            sync:
              fromHost:
                secrets:
                  enabled: true
                  mappings:
                    byName:
                      "agent/bifrost-secret": "proxy/bifrost-secret"
                      "app/vc-vcluster": "kagent/vcluster-app-kubeconfig"
                      "agent/kagent-home-viewer-token": "kagent/home-cluster-viewer-token"
