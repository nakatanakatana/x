apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vcluster-agent
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: agent
  path: "components/vcluster/base"
  prune: true
  timeout: 1m
  patches:
    - target:
        kind: HelmRelease
        name: vcluster
      patch: |
        - op: add
          path: /spec/values
          value:
            controlPlane:
              service:
                annotations:
                  tailscale.com/expose: "true"
                  tailscale.com/hostname: "vcluster-agent"
            exportKubeConfig:
              server: "https://vcluster.agent.svc.cluster.local:443"
            policies:
              resourceQuota:
                quota:
                  requests.cpu: 8
                  requests.memory: 32Gi
                  limits.cpu: 24
                  limits.memory: 48Gi
                  count/pods: 40
            sync:
              toHost:
                networkPolicies:
                  enabled: true
                volumeSnapshots:
                  enabled: true
                volumeSnapshotContents:
                  enabled: true
              fromHost:
                volumeSnapshotClasses:
                  enabled: true
                secrets:
                  enabled: true
                  mappings:
                    byName:
                      "agent/bifrost-secret": "proxy/bifrost-secret"
                      "agent/egress-proxy-secret": "proxy/egress-proxy-secret"
                      "agent/egress-proxy-ca-public": "sandbox/egress-proxy-ca-public"
                      "agent/opencode-server-auth": "sandbox/opencode-server-auth"
