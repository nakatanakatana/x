  replica:
    type: s3
    s3:
      endpoint: http://storage:8010
      bucket: nostr
      path: relay/relay.db
      credentials:
        accessKeyID:
          secretKeyRef:
            name: nostr-storage
            key: access-key-id
        secretAccessKey:
          secretKeyRef:
            name: nostr-storage
            key: secret-access-key
---
apiVersion: litestream.mytools.nakatanakatana.app/v1alpha1
kind: LitestreamReplica
