apiVersion: litestream.mytools.nakatanakatana.app/v1alpha1
kind: LitestreamReplica
metadata:
  name: feed-reader-db-replica
  namespace: app
spec:
  replica:
    type: s3
    s3:
      endpoint: http://storage:8010
      bucket: feed-reader
      path: feed-reader.db
      credentials:
        accessKeyID:
          secretKeyRef:
            name: feed-reader-storage
            key: access_key
        secretAccessKey:
          secretKeyRef:
            name: feed-reader-storage
            key: access_secret
---
apiVersion: litestream.mytools.nakatanakatana.app/v1alpha1
