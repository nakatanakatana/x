apiVersion: litestream.mytools.nakatanakataka.app/v1alpha1
kind: Litestream
metadata:
  name: feed-reader-db-debug
  namespace: app
spec:
  image:
    repository: litestream/litestream
    tag: 0.5.15
    digest: sha256:f45ca298a567bef6edd23d43429b5f80721473a9a9719e467f11d7888999403e
    pullPolicy: IfNotPresent
  injection:
    targetContainer: sqlite3
    volume: data
    podSecurityContext:
      fsGroup: 65532
      fsGroupChangePolicy: OnRootMismatch
  databases:
    - name: feed-reader
      path: /data/feed-reader.db
      restore:
        replicaRef:
          name: feed-reader-db-debug-source
        ifDatabaseExists: skip
        ifReplicaMissing: fail
        integrityCheck: quick
