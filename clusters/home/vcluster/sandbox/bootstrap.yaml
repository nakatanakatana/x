apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vcluster-sandbox-flux-bootstrap
  namespace: sandbox
spec:
  interval: 5m
  timeout: 2m
  prune: false
  dependsOn:
    - name: vcluster-sandbox
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "clusters/sandbox/flux-system"
  kubeConfig:
    secretRef:
      name: vc-vcluster
      key: config
