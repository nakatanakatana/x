apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: monitoring
  path: components/loki
  prune: true
  timeout: 20m
  dependsOn:
    - name: monitoring-controller
    - name: nisshi
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: loki
      namespace: monitoring
