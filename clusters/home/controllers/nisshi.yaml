apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nisshi
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: monitoring
  path: components/nisshi
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: nisshi
      namespace: monitoring
