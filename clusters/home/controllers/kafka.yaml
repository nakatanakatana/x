apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kafka
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: monitoring
  path: components/kafka
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: kafka
      namespace: monitoring
