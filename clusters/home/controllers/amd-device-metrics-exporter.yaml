apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: amd-device-metrics-exporter
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: kube-amd-gpu
  path: components/amd-device-metrics-exporter
  dependsOn:
    - name: monitoring-controller
  prune: true
  timeout: 5m
