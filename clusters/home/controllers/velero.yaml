apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velero
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: velero
  path: "components/velero"
  dependsOn:
    - name: cluster-configs
    - name: external-snapshotter-controller
  prune: true
  wait: true
  timeout: 10m
