apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubeblocks
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: kb-system
  path: "components/kubeblocks"
  dependsOn:
    - name: kubeblocks-crds
  prune: true
  wait: true
  timeout: 10m
