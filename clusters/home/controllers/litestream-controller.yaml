apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litestream-controller
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "components/litestream-controller"
  dependsOn:
    - name: cert-manager
  prune: true
  wait: true
  timeout: 5m
