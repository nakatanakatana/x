apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v21.2.0@sha256:c9e6ed4ac3fcf67b28f38358bb9619dee4d1dfb96ddd4b9b583eee316a15f04d
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  waitTimeoutForHealthyOSDInMinutes: 10
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: pg_autoscaler
        enabled: true
  dashboard:
    enabled: true
    ssl: true
  monitoring:
    enabled: true
    metricsDisabled: false
  network:
    connections:
      encryption:
        enabled: false
      compression:
        enabled: false
      requireMsgr2: false

  security:
    cephx:
      daemon:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
        keyType: aes256k

  crashCollector:
    disable: false
  logCollector:
    enabled: false
    periodicity: daily
    maxLogSize: 500M
  cephConfig:
    global:
      mon_cluster_log_level: warning
      debug_mon: "0/5"
      debug_mgr: "0/5"
      debug_rgw: "0/5"
      mon_cluster_log_to_stderr: "false"
      mon_data_avail_warn: "15"
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
    allowUninstallWithVolumes: false
  removeOSDsIfOutAndSafeToRemove: false
  priorityClassNames:
    mon: system-node-critical
    osd: system-node-critical
    mgr: system-cluster-critical
  resources:
    osd:
      requests:
        cpu: "500m"
        memory: "4Gi"
      limits:
        memory: "6Gi"
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: "n5"
        devices:
          - name: "sda"
          - name: "sdb"
          - name: "sdc"
          - name: "sdd"
      - name: "rpi"
        devices:
          - name: "nvme0n1p3"
      - name: "rk1"
        devices:
          - name: "nvme0n1"
      - name: "rk2"
        devices:
          - name: "nvme0n1"
      - name: "rk3"
        devices:
          - name: "nvme0n1"
      - name: "rk4"
        devices:
          - name: "nvme0n1"
    onlyApplyOSDPlacement: false
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
    pgHealthCheckTimeout: 0

  healthCheck:
    daemonHealth:
      mon:
        disabled: false
        interval: 45s
      osd:
        disabled: false
        interval: 60s
      status:
        disabled: false
        interval: 60s
    muteHealthWarning:
      AUTH_EMERGENCY_CIPHERS_SET:
        policy: mute
      AUTH_INSECURE_CLIENT_KEY_TYPE:
        policy: mute
      AUTH_INSECURE_KEYS_ALLOWED:
        policy: mute
      AUTH_INSECURE_KEYS_CREATABLE:
        policy: mute
    livenessProbe:
      mon:
        disabled: false
      mgr:
        disabled: false
      osd:
        disabled: false
    startupProbe:
      mon:
        disabled: false
      mgr:
        disabled: false
      osd:
        disabled: false
