apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    role: alert-rules
  name: external-secrets-rules
  namespace: external-secrets
spec:
  groups:
    - name: external-secrets
      rules:
        - alert: ExternalSecretControllerDown
          annotations:
            description: "external-secrets controller has disappeared from Prometheus target discovery."
            summary: "external-secrets controller is down or unreachable"
          expr: "absent(up{job=~\".*external-secrets.*\"} == 1)"
          for: 10m
          labels:
            severity: critical
        - alert: ClusterSecretStoreNotReady
          annotations:
            description: "ClusterSecretStore {{ $labels.name }} is not in Ready state."
            summary: "ClusterSecretStore {{ $labels.name }} is not ready"
          expr: "clustersecretstore_status_condition{condition=\"Ready\", status=\"False\"} == 1"
          for: 10m
          labels:
            severity: critical
        - alert: SecretStoreNotReady
          annotations:
            description: "SecretStore {{ $labels.name }} in namespace {{ or $labels.exported_namespace $labels.namespace }} is not in Ready state."
            summary: "SecretStore {{ $labels.name }} is not ready"
          expr: "secretstore_status_condition{condition=\"Ready\", status=\"False\"} == 1"
          for: 10m
          labels:
            severity: warning
        - alert: ExternalSecretNotReady
          annotations:
            description: "ExternalSecret {{ $labels.name }} in namespace {{ or $labels.exported_namespace $labels.namespace }} has failed to synchronize for more than 15 minutes."
            summary: "ExternalSecret {{ $labels.name }} is not ready"
          expr: "externalsecret_status_condition{condition=\"Ready\", status=\"False\"} == 1"
          for: 15m
          labels:
            severity: warning
        - alert: ExternalSecretSyncError
          annotations:
            description: "ExternalSecret {{ $labels.name }} in namespace {{ or $labels.exported_namespace $labels.namespace }} is reporting synchronization errors."
            summary: "ExternalSecret {{ $labels.name }} sync error"
          expr: "rate(externalsecret_sync_calls_error[10m]) > 0"
          for: 15m
          labels:
            severity: warning
