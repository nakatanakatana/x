apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    role: alert-rules
  name: cert-manager-rules
  namespace: cert-manager
spec:
  groups:
    - name: cert-manager
      rules:
        - alert: CertManagerAbsent
          annotations:
            description: "cert-manager has disappeared from Prometheus target discovery."
            summary: "cert-manager is down or unreachable"
          expr: "absent(up{job=~\".*cert-manager.*\"} == 1)"
          for: 10m
          labels:
            severity: critical
        - alert: CertManagerCertExpirySoon
          annotations:
            description: "The certificate {{ $labels.name }} in namespace {{ or $labels.exported_namespace $labels.namespace }} expires in less than 21 days."
            summary: "Certificate {{ $labels.name }} expiring soon"
          expr: "(certmanager_certificate_expiration_timestamp_seconds - time()) < (21 * 24 * 3600)"
          for: 1h
          labels:
            severity: warning
        - alert: CertManagerCertExpiryCritical
          annotations:
            description: "The certificate {{ $labels.name }} in namespace {{ or $labels.exported_namespace $labels.namespace }} expires in less than 7 days."
            summary: "Certificate {{ $labels.name }} expiring critically soon"
          expr: "(certmanager_certificate_expiration_timestamp_seconds - time()) < (7 * 24 * 3600)"
          for: 1h
          labels:
            severity: critical
        - alert: CertManagerCertNotReady
          annotations:
            description: "The certificate {{ $labels.name }} in namespace {{ or $labels.exported_namespace $labels.namespace }} has not been Ready for more than 15 minutes."
            summary: "Certificate {{ $labels.name }} is not ready"
          expr: "certmanager_certificate_ready_status{condition!=\"True\"} == 1"
          for: 15m
          labels:
            severity: warning
        - alert: CertManagerHittingRateLimits
          annotations:
            description: "cert-manager is experiencing rate limiting (HTTP 429) from the ACME issuer backend."
            summary: "cert-manager hitting ACME rate limits"
          expr: "rate(certmanager_http_acme_client_request_count{status=\"429\"}[5m]) > 0"
          for: 5m
          labels:
            severity: warning
