apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: object-storage-backup-credentials
  namespace: app
spec:
  refreshInterval: 16h13m
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: object-storage-backup-credentials
    creationPolicy: Owner
    template:
      data:
        S3_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "{{ .S3_SECRET_ACCESS_KEY }}"
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: pcloud-s3/S3_ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: pcloud-s3/S3_SECRET_ACCESS_KEY
