apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rclone-s3-credentials
  namespace: pcloud-s3
spec:
  refreshInterval: 60m
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: rclone-s3-credentials
    creationPolicy: Owner
    template:
      data:
        PCLOUD_TOKEN: "{{ .PCLOUD_TOKEN }}"
        S3_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "{{ .S3_SECRET_ACCESS_KEY }}"
        RCLONE_AUTH_KEY: '"{{ .S3_ACCESS_KEY_ID }},{{ .S3_SECRET_ACCESS_KEY }}"'
  data:
    - secretKey: PCLOUD_TOKEN
      remoteRef:
        key: pcloud-s3/PCLOUD_TOKEN
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: pcloud-s3/S3_ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: pcloud-s3/S3_SECRET_ACCESS_KEY
