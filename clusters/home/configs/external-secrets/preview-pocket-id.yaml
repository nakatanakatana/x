apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: preview-pocket-id
  namespace: app
spec:
  refreshInterval: 22h53m
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: preview-pocket-id
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: preview-pocket-id/client_id
    - secretKey: client-secret
      remoteRef:
        key: preview-pocket-id/client_secret
    - secretKey: cookie-secret
      remoteRef:
        key: preview-pocket-id/cookie_secret
---
