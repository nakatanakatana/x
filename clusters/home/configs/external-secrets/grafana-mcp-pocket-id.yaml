apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-pocket-id
  namespace: monitoring
spec:
  refreshInterval: 20h47m
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: grafana-mcp-pocket-id
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: grafana-mcp-pocket-id/client_id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: grafana-mcp-pocket-id/client_secret
