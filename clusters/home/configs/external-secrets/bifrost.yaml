apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost-secret
  namespace: agent
spec:
  refreshInterval: 12h31m
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: bifrost-secret
    creationPolicy: Owner
  data:
    - secretKey: OPENCODE_API_KEY
      remoteRef:
        key: bifrost/OPENCODE_API_KEY
    - secretKey: BIFROST_ADMIN_USERNAME
      remoteRef:
        key: bifrost/BIFROST_ADMIN_USERNAME
    - secretKey: BIFROST_ADMIN_PASSWORD
      remoteRef:
        key: bifrost/BIFROST_ADMIN_PASSWORD
