apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-configs
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/home/configs
  dependsOn:
    - name: flux-system
    - name: external-secrets
    - name: cert-manager
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: velero-s3-credentials
      namespace: velero
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: velero-repo-credentials
      namespace: velero
  prune: true
  timeout: 1m
