apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: external-snapshotter
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/kubernetes-csi/external-snapshotter.git
  ref:
    tag: v8.6.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-snapshotter-crd
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: external-snapshotter
  path: ./client/config/crd
  prune: false
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-snapshotter-controller
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: external-snapshotter
  path: ./deploy/kubernetes/snapshot-controller
  targetNamespace: kube-system
  dependsOn:
    - name: external-snapshotter-crd
    - name: rook-ceph-operator
  # kube-system is shared; avoid deleting resources that are not rendered by
  # this upstream kustomization when the source changes.
  prune: false
  wait: true
  timeout: 5m
