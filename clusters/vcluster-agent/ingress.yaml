apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bifrost
  namespace: proxy
  annotations:
    tailscale.com/proxy-group: "ingress-proxies"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: bifrost
      port:
        number: 8080
  tls:
    - hosts:
        - llm-proxy
