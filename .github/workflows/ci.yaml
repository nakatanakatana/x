name: ci

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Kustomize
        run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
      - name: Test manifest policies
        run: go test ./...
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@v2.9.4
        with:
          version: '2.9.4'
      - name: Prepare Flux build temp directory
        run: mkdir -p .flux-tmp
      - name: Check duplicate Flux resource ownership
        env:
          TMPDIR: ${{ github.workspace }}/.flux-tmp
        run: go run ./tests repository --repo-root .
      - name: Setup Flux Schema CLI
        uses: fluxcd/flux-schema/actions/setup@v0.12.1
      - name: Validate manifests
        uses: fluxcd/flux-schema/actions/validate@v0.12.1
