name: ci

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Kustomize
        run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
      - name: Test Litestream controller and debug manifests
        run: bash tests/litestream-manifests.sh
      - name: Test pCloud S3 manifests
        run: tests/pcloud-s3-manifests.sh
      - name: Test External Secrets rate limit policy
        run: tests/external-secrets-rate-limit.sh
      - name: Setup Flux Schema CLI
        uses: fluxcd/flux-schema/actions/setup@v0.11.0
      - name: Validate manifests
        uses: fluxcd/flux-schema/actions/validate@v0.11.0
