apiVersion: apps/v1
kind: Deployment
metadata:
  name: latest-image
  namespace: default
spec:
  selector:
    matchLabels:
      app: latest-image
  template:
    metadata:
      labels:
        app: latest-image
    spec:
      containers:
        - name: app
          image: nginx:latest@sha256:8541484afbc9c8a5a8a99b379568ebbc957f658583ec9448fc43104229c03cf8
