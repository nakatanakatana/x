---
# Source: official Neon chart 1.0.1 compute ComponentDefinition (representative runtime fields).
apiVersion: apps.kubeblocks.io/v1
kind: ComponentDefinition
metadata:
  name: neon-compute-1.0.1
  labels:
    helm.sh/chart: neon-1.0.1
    app.kubernetes.io/name: neon
    app.kubernetes.io/instance: neon
    app.kubernetes.io/managed-by: Helm
  annotations:
    kubeblocks.io/crd-api-version: apps.kubeblocks.io/v1
spec:
  provider: kubeblocks
  serviceKind: neon-compute
  runtime:
    containers:
      - name: compute
        image: docker.io/apecloud/neon:pg14-1.0.0
        command:
          - compute_ctl
        volumeMounts:
          - name: data
            mountPath: /data
    volumes:
      - name: data
        emptyDir: {}
