tempo:
  repository: grafana/tempo
  tag: 2.7.2
  extraArgs:
    config.expand-env: "true"
  extraEnv:
    - name: AWS_DEFAULT_REGION
      value: us-east-1
  extraEnvFrom:
    - secretRef:
        name: observability-tempo
  retention: 48h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  storage:
    trace:
      backend: s3
      s3:
        bucket: observability-tempo
        endpoint: rook-ceph-rgw-celld.rook-ceph.svc.cluster.local:443
        region: us-east-1
        insecure: false
        tls_insecure_skip_verify: true
        forcepathstyle: true
        access_key: ${AWS_ACCESS_KEY_ID}
        secret_key: ${AWS_SECRET_ACCESS_KEY}
