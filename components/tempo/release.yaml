apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      interval: 10m
      chart: tempo-distributed
      version: '3.7.0'
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
  releaseName: tempo
  valuesFrom:
    - kind: ConfigMap
      name: tempo-values
