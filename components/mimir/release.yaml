apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: monitoring
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      interval: 10m
      chart: mimir-distributed
      version: '6.2.0'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  releaseName: mimir
  valuesFrom:
    - kind: ConfigMap
      name: mimir-values
