apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-config
  namespace: proxy
data:
  config.json: |
    {
      "$schema": "https://www.getbifrost.ai/schema",
      "version": 1,
      "source_of_truth": "config.json",
      "client": {
        "enforce_auth_on_inference": false,
        "header_filter_config": {
          "allowlist": ["x-opencode-session"]
        }
      },
      "providers": {
        "openai": {
          "enabled": true,
          "network_config": {
            "base_url": "https://opencode.ai/inference/go"
          },
          "keys": [
            {
              "name": "opencode-go",
              "value": "env.OPENCODE_API_KEY",
              "models": ["*"]
            }
          ]
        }
      }
    }
