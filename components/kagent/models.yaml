apiVersion: v1
kind: Secret
metadata:
  name: kagent-bifrost-auth
  namespace: kagent
type: Opaque
stringData:
  OPENAI_API_KEY: "bifrost-internal"
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: deepseek-v4-1-flash
  namespace: kagent
spec:
  provider: OpenAI
  model: deepseek-v4.1-flash
  apiKeySecret: kagent-bifrost-auth
  apiKeySecretKey: OPENAI_API_KEY
  defaultHeaders:
    x-bf-eh-x-opencode-session: "kagent-default"
  openAI:
    baseUrl: "http://bifrost.proxy.svc.cluster.local:8080/openai/v1"
---
