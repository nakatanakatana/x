apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-device-metrics-exporter
  namespace: kube-amd-gpu
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      interval: 10m
      chart: device-metrics-exporter-charts
      version: 'v1.5.0'
      sourceRef:
        kind: HelmRepository
        name: amd-device-metrics-exporter
  releaseName: amd-device-metrics-exporter
  valuesFrom:
    - kind: ConfigMap
      name: amd-device-metrics-exporter
