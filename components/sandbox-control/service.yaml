apiVersion: v1
kind: Service
metadata:
  name: sandbox-control
  namespace: agent-sandbox-system
spec:
  type: ClusterIP
  selector:
    app: sandbox-control
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-control-ssh
  namespace: agent-sandbox-system
  annotations:
    tailscale.com/hostname: "sandbox-ctl"
    tailscale.com/proxy-group: "ingress-proxies"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: sandbox-control
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
