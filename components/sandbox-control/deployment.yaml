apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-control
  namespace: agent-sandbox-system
  labels:
    app: sandbox-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-control
  template:
    metadata:
      labels:
        app: sandbox-control
    spec:
      serviceAccountName: sandbox-control
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: network
                    operator: NotIn
                    values:
                      - slow
      containers:
        - name: sandbox-control
          image: ghcr.io/nakatanakatana/sandbox-control:0.15.1@sha256:45e2ff1d2d8418aa427a848a41069a5d0bf4f3838ee74b2ef62502ebc36b087f
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: ssh
              containerPort: 2222
              protocol: TCP
          env:
            - name: SSH_GITHUB_USERS
              value: "nakatanakatana"
            - name: EGRESS_PROXY_ADMIN_URL
              value: "http://egress-proxy-admin.proxy.svc.cluster.local:3129"
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sandbox-control-secret
                  key: GITHUB_APP_CLIENT_ID
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
