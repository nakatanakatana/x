apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandbox-control
  namespace: agent-sandbox-system
  annotations:
    tailscale.com/proxy-group: "ingress-proxies"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: sandbox-control
      port:
        number: 8080
  tls:
    - hosts:
        - sandbox-control
