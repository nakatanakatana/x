apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/pl4nty/cloudflare-kubernetes-gateway//config/default?ref=v0.10.2
  - pdb.yaml
patches:
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cloudflare-gateway
    target:
      kind: Namespace
      name: cloudflare-gateway
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloudflare-controller-manager
        namespace: cloudflare-gateway
      spec:
        replicas: 2
        template:
          spec:
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          control-plane: controller-manager
                      topologyKey: kubernetes.io/hostname
    target:
      kind: Deployment
      name: cloudflare-controller-manager
