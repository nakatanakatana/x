crds:
  enabled: true
extraArgs:
  - --logging-format=json
webhook:
  extraArgs:
    - --logging-format=json
cainjector:
  extraArgs:
    - --logging-format=json
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    endpointAdditionalProperties:
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: "(go|process)_.*"
