apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llama-cpp
  labels:
    app.kubernetes.io/name: llama-cpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp
    spec:
      nodeSelector:
        kubernetes.io/hostname: n5
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: prepare-model
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              pip install -q huggingface_hub
              python3 -c '
              import os, huggingface_hub
              repo_id = os.environ.get("MODEL_REPO", "google/gemma-4-26B-A4B-it-qat-q4_0-gguf")
              filename = os.environ.get("MODEL_FILENAME", "gemma-4-26B_q4_0-it.gguf")
              local_dir = os.environ.get("MODEL_LOCAL_DIR", "/models")
              token = os.environ.get("HUGGING_FACE_HUB_TOKEN")
              target_file = os.path.join(local_dir, filename)
              if os.path.exists(target_file):
                  print(f"Model already exists at {target_file}")
              else:
                  print(f"Downloading {filename} from {repo_id}...")
                  huggingface_hub.hf_hub_download(
                      repo_id=repo_id,
                      filename=filename,
                      local_dir=local_dir,
                      token=token
                  )
                  print(f"Downloaded to {target_file}")
              '
          env:
            - name: MODEL_REPO
              value: google/gemma-4-26B-A4B-it-qat-q4_0-gguf
            - name: MODEL_FILENAME
              value: gemma-4-26B_q4_0-it.gguf
            - name: MODEL_LOCAL_DIR
              value: /models
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llama-cpp-secret
                  key: HUGGING_FACE_HUB_TOKEN
                  optional: true
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-rocm
          imagePullPolicy: IfNotPresent
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - -m
            - /models/gemma-4-26B_q4_0-it.gguf
            - -ngl
            - "99"
            - -c
            - "8192"
            - --alias
            - "google/gemma-4-26B-A4B-it-qat-q4_0-gguf"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              amd.com/gpu: "1"
              memory: 32Gi
              cpu: "8"
            requests:
              amd.com/gpu: "1"
              memory: 16Gi
              cpu: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 120
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
