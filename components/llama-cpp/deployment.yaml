apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llama-cpp
  labels:
    app.kubernetes.io/name: llama-cpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/hostname: n5
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: prepare-model
          image: python:3.14-slim@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              pip install -q huggingface_hub
              python3 -c '
              import os, huggingface_hub
              repo_id = os.environ.get("MODEL_REPO", "google/gemma-4-12B-it-qat-q4_0-gguf")
              filename = os.environ.get("MODEL_FILENAME", "gemma-4-12b-it-qat-q4_0.gguf")
              mmproj_filename = os.environ.get(
                  "MODEL_MMPROJ_FILENAME",
                  "mmproj-gemma-4-12b-it-qat-q4_0.gguf",
              )
              mtp_repo_id = os.environ.get(
                  "MTP_MODEL_REPO",
                  "unsloth/gemma-4-12B-it-qat-GGUF",
              )
              mtp_filename = os.environ.get(
                  "MTP_MODEL_FILENAME",
                  "MTP/mtp-gemma-4-12B-it-Q4_0.gguf",
              )
              local_dir = os.environ.get("MODEL_LOCAL_DIR", "/models")
              token = os.environ.get("HUGGING_FACE_HUB_TOKEN")
              model_files = (
                  (repo_id, filename),
                  (repo_id, mmproj_filename),
                  (mtp_repo_id, mtp_filename),
              )
              for source_repo, model_file in model_files:
                  target_file = os.path.join(local_dir, model_file)
                  os.makedirs(os.path.dirname(target_file), exist_ok=True)
                  if os.path.exists(target_file):
                      print(f"Model file already exists at {target_file}")
                  else:
                      print(f"Downloading {model_file} from {source_repo}...")
                      huggingface_hub.hf_hub_download(
                          repo_id=source_repo,
                          filename=model_file,
                          local_dir=local_dir,
                          token=token
                      )
                      print(f"Downloaded to {target_file}")
              '
          env:
            - name: MODEL_REPO
              value: google/gemma-4-12B-it-qat-q4_0-gguf
            - name: MODEL_FILENAME
              value: gemma-4-12b-it-qat-q4_0.gguf
            - name: MODEL_MMPROJ_FILENAME
              value: mmproj-gemma-4-12b-it-qat-q4_0.gguf
            - name: MTP_MODEL_REPO
              value: unsloth/gemma-4-12B-it-qat-GGUF
            - name: MTP_MODEL_FILENAME
              value: MTP/mtp-gemma-4-12B-it-Q4_0.gguf
            - name: MODEL_LOCAL_DIR
              value: /models
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llama-cpp-secret
                  key: HUGGING_FACE_HUB_TOKEN
                  optional: true
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-rocm@sha256:c0bbf966565a5c55d06ae938d940a79fa8a60a2d06aed456e2905b0930051ca2
          imagePullPolicy: IfNotPresent
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - -m
            - /models/gemma-4-12b-it-qat-q4_0.gguf
            - --mmproj
            - /models/mmproj-gemma-4-12b-it-qat-q4_0.gguf
            - --model-draft
            - /models/MTP/mtp-gemma-4-12B-it-Q4_0.gguf
            - --spec-type
            - draft-mtp
            - --spec-draft-n-max
            - "4"
            - --spec-draft-ngl
            - "99"
            - --fit
            - off
            - -ngl
            - "99"
            - -c
            - "65536"
            - -b
            - "1024"
            - -ub
            - "512"
            - -np
            - "1"
            - -fa
            - on
            - -ctk
            - q8_0
            - -ctv
            - q8_0
            - --jinja
            - -t
            - "8"
            - -tb
            - "8"
            - --temp
            - "1.0"
            - --top-p
            - "0.95"
            - --top-k
            - "64"
            - --min-p
            - "0.0"
            - --alias
            - "google/gemma-4-12B-it-qat-q4_0-gguf"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              amd.com/gpu: "1"
              memory: 32Gi
              cpu: "8"
            requests:
              amd.com/gpu: "1"
              memory: 16Gi
              cpu: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 120
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
