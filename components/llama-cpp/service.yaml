apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
  namespace: llama-cpp
  annotations:
    tailscale.com/hostname: "llama-cpp"
    tailscale.com/proxy-group: "ingress-proxies"
  labels:
    app.kubernetes.io/name: llama-cpp
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: llama-cpp
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
