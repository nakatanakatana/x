apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: vllm
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "vllm"
  labels:
    app.kubernetes.io/name: vllm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
