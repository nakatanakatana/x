apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      interval: 10m
      chart: grafana
      version: '13.2.5'
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
  releaseName: grafana
  valuesFrom:
    - kind: ConfigMap
      name: grafana-values
