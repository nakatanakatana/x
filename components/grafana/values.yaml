service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  ingressClassName: tailscale
  annotations:
    tailscale.com/proxy-class: avoid-slow-nodes
  hosts:
    - grafana
  tls:
    - hosts:
        - grafana

persistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

envFromSecrets:
  - name: grafana-pocket-id

grafana.ini:
  server:
    root_url: https://grafana.mora-egret.ts.net/
  auth.generic_oauth:
    enabled: true
    name: Pocket ID
    allow_sign_up: true
    auto_login: false
    scopes: openid email profile
    auth_url: https://id.nakatanakatana.app/api/oidc/authorize
    token_url: https://id.nakatanakatana.app/api/oidc/token
    api_url: https://id.nakatanakatana.app/api/oidc/userinfo
    email_attribute_path: email:primary
    role_attribute_path: "'Admin'"
    skip_org_role_sync: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Local Loki
        type: loki
        uid: local-loki
        url: http://loki-gateway.monitoring.svc.cluster.local
        access: proxy
        jsonData:
          maxLines: 1000
      - name: Local Mimir
        type: prometheus
        uid: local-mimir
        url: http://mimir-gateway.monitoring.svc.cluster.local/prometheus
        access: proxy
        jsonData:
          httpMethod: POST
      - name: Local Tempo
        type: tempo
        uid: local-tempo
        url: http://tempo-query-frontend.monitoring.svc.cluster.local:3200
        access: proxy

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    searchNamespace: monitoring
    provider:
      allowUiUpdates: false
      foldersFromFilesStructure: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

