apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
namespace: monitoring
resources:
  - release.yaml
  - mcp.yaml
configMapGenerator:
  - name: grafana-values
    files:
      - values.yaml=values.yaml
  - name: grafana-dashboards-flux
    files:
      - dashboards/flux/flux-cluster-stats.json
      - dashboards/flux/flux-control-plane.json
      - dashboards/flux/flux-logs.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Flux"
  - name: grafana-dashboards-general
    files:
      - dashboards/general/clusters.json
      - dashboards/general/local-observability.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboards-ceph
    files:
      - dashboards/ceph/ceph-cluster.json
      - dashboards/ceph/ceph-osd-single.json
      - dashboards/ceph/ceph-pools.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Ceph"
configurations:
  - kustomizeconfig.yaml
