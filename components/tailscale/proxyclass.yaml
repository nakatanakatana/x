apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: avoid-slow-nodes
spec:
  statefulSet:
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: network
                    operator: NotIn
                    values:
                      - slow
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: ha-ingress
spec:
  statefulSet:
    pod:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: network
                    operator: NotIn
                    values:
                      - slow
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              tailscale.com/parent-resource: ingress-proxies
              tailscale.com/parent-resource-type: proxygroup
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: ha-egress
spec:
  statefulSet:
    pod:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: network
                    operator: NotIn
                    values:
                      - slow
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              tailscale.com/parent-resource: egress-proxies
              tailscale.com/parent-resource-type: proxygroup
