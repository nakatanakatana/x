apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      interval: 10m
      chart: loki
      version: '20.0.3'
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
  releaseName: loki
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
