apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: agent-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-sandbox-controller-role
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: agent-sandbox
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - pods
      - pods/status
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
      - sandboxes/finalizers
      - sandboxes/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxclaims
      - sandboxclaims/finalizers
      - sandboxclaims/status
      - sandboxtemplates
      - sandboxtemplates/finalizers
      - sandboxtemplates/status
      - sandboxwarmpools
      - sandboxwarmpools/finalizers
      - sandboxwarmpools/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sandbox-controller-binding
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: agent-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-sandbox-controller-role
subjects:
  - kind: ServiceAccount
    name: agent-sandbox-controller
    namespace: agent-sandbox-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: agent-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-sandbox
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-sandbox
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: agent-sandbox-controller
      containers:
        - name: manager
          image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/controller:v1.0.2
          command:
            - /manager
          args:
            - --leader-elect
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
