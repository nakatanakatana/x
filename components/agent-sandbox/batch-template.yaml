apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: batch-agent-template
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: batch-template
    app.kubernetes.io/part-of: agent-sandbox
spec:
  podTemplate:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: ghcr.io/nakatanakatana/agy-sandbox-runtime:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: OPENAI_BASE_URL
              value: "http://bifrost.proxy.svc.cluster.local:8080/v1"
            - name: OPENAI_API_KEY
              value: "sk-internal-bifrost-managed"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: ephemeral-workspace
              mountPath: /workspace
      volumes:
        - name: ephemeral-workspace
          emptyDir: {}
---
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: batch-agent-warmpool
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: warmpool
    app.kubernetes.io/part-of: agent-sandbox
spec:
  templateRef:
    name: batch-agent-template
  replicas: 1
