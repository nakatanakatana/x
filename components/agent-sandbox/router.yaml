apiVersion: v1
kind: Service
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: router
    app.kubernetes.io/part-of: agent-sandbox
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: router
    app.kubernetes.io/part-of: agent-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-sandbox
      app.kubernetes.io/component: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-sandbox
        app.kubernetes.io/component: router
        app.kubernetes.io/part-of: agent-sandbox
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandbox-router-go:latest
          args:
            - --path-routing-prefix=/sandboxes
            - --authz-mode=scoped-token
            - --port=8080
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
