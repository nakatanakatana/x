apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-interactive-sandbox-sample
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: interactive-sandbox
    app.kubernetes.io/part-of: agent-sandbox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-helper-scripts
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: helper-scripts
    app.kubernetes.io/part-of: agent-sandbox
data:
  stop-sandbox: |
    #!/bin/sh
    set -eu
    echo "Stopping sandbox Pod..."
    kubectl delete sandbox "$(hostname)" --grace-period=5
  destroy-sandbox: |
    #!/bin/sh
    set -eu
    SB_NAME="${HOSTNAME:-$(hostname)}"
    echo "Deleting PVC first..."
    kubectl delete pvc "workspace-${SB_NAME}" --wait=false
    echo "Deleting Sandbox..."
    kubectl delete sandbox "${SB_NAME}" --wait=false
  stop-sandbox.sh: |
    #!/bin/sh
    set -eu
    echo "Stopping sandbox Pod..."
    kubectl delete sandbox "$(hostname)" --grace-period=5
  destroy-sandbox.sh: |
    #!/bin/sh
    set -eu
    SB_NAME="${HOSTNAME:-$(hostname)}"
    echo "Deleting PVC first..."
    kubectl delete pvc "workspace-${SB_NAME}" --wait=false
    echo "Deleting Sandbox..."
    kubectl delete sandbox "${SB_NAME}" --wait=false
---
apiVersion: agents.x-k8s.io/v1alpha1
kind: Sandbox
metadata:
  name: interactive-sandbox-sample
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: interactive-sandbox
    app.kubernetes.io/part-of: agent-sandbox
spec:
  podTemplate:
    spec:
      serviceAccountName: sandbox-self-terminator
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: ghcr.io/nakatanakatana/agy-sandbox-runtime:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: ttyd
              containerPort: 7681
            - name: ssh
              containerPort: 2222
            - name: sandboxd
              containerPort: 8080
          env:
            - name: OPENAI_BASE_URL
              value: "http://bifrost.proxy.svc.cluster.local:8080/v1"
            - name: OPENAI_API_KEY
              value: "sk-internal-bifrost-managed"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: workspace
              mountPath: /home/user
            - name: scripts
              mountPath: /usr/local/bin/stop-sandbox
              subPath: stop-sandbox
            - name: scripts
              mountPath: /usr/local/bin/destroy-sandbox
              subPath: destroy-sandbox
            - name: scripts
              mountPath: /usr/local/bin/stop-sandbox.sh
              subPath: stop-sandbox.sh
            - name: scripts
              mountPath: /usr/local/bin/destroy-sandbox.sh
              subPath: destroy-sandbox.sh
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-interactive-sandbox-sample
        - name: scripts
          configMap:
            name: sandbox-helper-scripts
            defaultMode: 0755
