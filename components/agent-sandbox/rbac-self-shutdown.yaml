apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-self-terminator
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: agent-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-self-terminator
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: agent-sandbox
rules:
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-self-terminator-binding
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: agent-sandbox
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: agent-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-self-terminator
subjects:
  - kind: ServiceAccount
    name: sandbox-self-terminator
    namespace: agent-sandbox-system
