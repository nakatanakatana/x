destinations:
  metricsService:
    type: prometheus
    url: http://mimir-gateway.monitoring.svc.cluster.local/api/v1/push
    # Grafana Cloud destination (commented out for rollback):
    # url: https://prometheus-us-central1.grafana.net/api/prom/push
    # secret:
    #   create: false
    #   name: grafana-cloud-secret
    #   namespace: monitoring
    # auth:
    #   type: basic
    #   usernameKey: prom_user
    #   passwordKey: password
  logsService:
    type: loki
    url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
    batchWait: 5s
    batchSize: 1MiB
    # Grafana Cloud destination (commented out for rollback):
    # url: https://logs-prod-us-central1.grafana.net/loki/api/v1/push
    # secret:
    #   create: false
    #   name: grafana-cloud-secret
    #   namespace: monitoring
    # auth:
    #   type: basic
    #   usernameKey: loki_user
    #   passwordKey: password
  tracesService:
    type: otlp
    url: http://tempo-distributor.monitoring.svc.cluster.local:4317
    protocol: grpc
    tls:
      insecure: true
    metrics:
      enabled: false
    logs:
      enabled: false
    traces:
      enabled: true
    # Grafana Cloud destination (commented out for rollback):
    # url: https://tempo-us-central1.grafana.net:443
    # protocol: grpc
    # secret:
    #   create: false
    #   name: grafana-cloud-secret
    #   namespace: monitoring
    # auth:
    #   type: basic
    #   usernameKey: tempo_user
    #   passwordKey: password
collectors:
  alloy-metrics:
    presets:
      - clustered
      - statefulset
    logging:
      format: json
  alloy-logs:
    presets:
      - filesystem-log-reader
      - daemonset
    logging:
      format: json
  alloy-singleton:
    presets:
      - singleton
    logging:
      format: json
    extraConfig: |-
      mimir.rules.kubernetes "k8s_rules" {
        address   = "http://mimir-ruler.monitoring.svc.cluster.local:8080"
        tenant_id = "anonymous"
      }
  alloy-receiver:
    presets:
      - deployment
    logging:
      format: json
    alloy:
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
clusterMetrics:
  enabled: true
  kube-state-metrics:
    metricsTuning:
      useDefaultAllowList: false
      includeMetrics:
        - gotk_resource_info
        - kube_cronjob_spec_suspend
        - kube_cronjob_status_last_schedule_time
        - kube_cronjob_status_last_successful_time
        - kube_job_status_failed
        - kube_job_status_succeeded
        - kube_job_status_start_time
  cadvisor:
    enabled: true
    metricsTuning:
      includeMetrics:
        - machine_cpu_cores
  collector: alloy-metrics
telemetryServices:
  kube-state-metrics:
    deploy: true
    customResourceState:
      enabled: true
      config:
        spec:
          resources:
            - groupVersionKind:
                group: kustomize.toolkit.fluxcd.io
                version: v1
                kind: Kustomization
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux Kustomization resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name:
                          - metadata
                          - name
                  labelsFromPath:
                    exported_namespace:
                      - metadata
                      - namespace
                    ready:
                      - status
                      - conditions
                      - '[type=Ready]'
                      - status
                    suspended:
                      - spec
                      - suspend
                    revision:
                      - status
                      - lastAppliedRevision
                    source_name:
                      - spec
                      - sourceRef
                      - name
            - groupVersionKind:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux HelmRelease resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name:
                          - metadata
                          - name
                  labelsFromPath:
                    exported_namespace:
                      - metadata
                      - namespace
                    ready:
                      - status
                      - conditions
                      - '[type=Ready]'
                      - status
                    suspended:
                      - spec
                      - suspend
                    revision:
                      - status
                      - history
                      - '0'
                      - chartVersion
                    chart_name:
                      - status
                      - history
                      - '0'
                      - chartName
                    chart_app_version:
                      - status
                      - history
                      - '0'
                      - appVersion
                    chart_ref_name:
                      - spec
                      - chartRef
                      - name
                    chart_source_name:
                      - spec
                      - chart
                      - spec
                      - sourceRef
                      - name
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: GitRepository
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux GitRepository resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name:
                          - metadata
                          - name
                  labelsFromPath:
                    exported_namespace:
                      - metadata
                      - namespace
                    ready:
                      - status
                      - conditions
                      - '[type=Ready]'
                      - status
                    suspended:
                      - spec
                      - suspend
                    revision:
                      - status
                      - artifact
                      - revision
                    url:
                      - spec
                      - url
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1beta2
                kind: Bucket
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux Bucket resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name:
                          - metadata
                          - name
                  labelsFromPath:
                    exported_namespace:
                      - metadata
                      - namespace
                    ready:
                      - status
                      - conditions
                      - '[type=Ready]'
                      - status
                    suspended:
                      - spec
                      - suspend
                    revision:
                      - status
                      - artifact
                      - revision
                    endpoint:
                      - spec
                      - endpoint
                    bucket_name:
                      - spec
                      - bucketName
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmRepository
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux HelmRepository resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name:
                          - metadata
                          - name
                  labelsFromPath:
                    exported_namespace:
                      - metadata
                      - namespace
                    ready:
                      - status
                      - conditions
                      - '[type=Ready]'
                      - status
                    suspended:
                      - spec
                      - suspend
                    revision:
                      - status
                      - artifact
                      - revision
                    url:
                      - spec
                      - url
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmChart
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux HelmChart resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name:
                          - metadata
                          - name
                  labelsFromPath:
                    exported_namespace:
                      - metadata
                      - namespace
                    ready:
                      - status
                      - conditions
                      - '[type=Ready]'
                      - status
                    suspended:
                      - spec
                      - suspend
                    revision:
                      - status
                      - artifact
                      - revision
                    chart_name:
                      - spec
                      - chart
                    chart_version:
                      - spec
                      - version
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: OCIRepository
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux OCIRepository resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name:
                          - metadata
                          - name
                  labelsFromPath:
                    exported_namespace:
                      - metadata
                      - namespace
                    ready:
                      - status
                      - conditions
                      - '[type=Ready]'
                      - status
                    suspended:
                      - spec
                      - suspend
                    revision:
                      - status
                      - artifact
                      - revision
                    url:
                      - spec
                      - url
            - groupVersionKind:
                group: notification.toolkit.fluxcd.io
                version: v1beta3
                kind: Alert
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux Alert resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name:
                          - metadata
                          - name
                  labelsFromPath:
                    exported_namespace:
                      - metadata
                      - namespace
                    suspended:
                      - spec
                      - suspend
            - groupVersionKind:
                group: notification.toolkit.fluxcd.io
                version: v1beta3
                kind: Provider
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux Provider resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name:
                          - metadata
                          - name
                  labelsFromPath:
                    exported_namespace:
                      - metadata
                      - namespace
                    suspended:
                      - spec
                      - suspend
            - groupVersionKind:
                group: notification.toolkit.fluxcd.io
                version: v1
                kind: Receiver
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux Receiver resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name:
                          - metadata
                          - name
                  labelsFromPath:
                    exported_namespace:
                      - metadata
                      - namespace
                    ready:
                      - status
                      - conditions
                      - '[type=Ready]'
                      - status
                    suspended:
                      - spec
                      - suspend
                    webhook_path:
                      - status
                      - webhookPath
    rbac:
      extraRules:
        - apiGroups:
            - source.toolkit.fluxcd.io
            - kustomize.toolkit.fluxcd.io
            - helm.toolkit.fluxcd.io
            - notification.toolkit.fluxcd.io
            - image.toolkit.fluxcd.io
          resources:
            - gitrepositories
            - buckets
            - helmrepositories
            - helmcharts
            - ocirepositories
            - kustomizations
            - helmreleases
            - alerts
            - providers
            - receivers
          verbs:
            - list
            - watch
  node-exporter:
    deploy: true
  opencost:
    deploy: false
hostMetrics:
  linuxHosts:
    enabled: true
    metricsTuning:
      includeMetrics:
        - node_hwmon_temp_celsius
        - node_hwmon_chip_names
        - node_hwmon_sensor_label
        - node_hwmon_fan_rpm
        - node_thermal_zone_temp
  enabled: true
  collector: alloy-metrics
cluster:
  name: home-k3s
clusterEvents:
  enabled: true
  collector: alloy-singleton
nodeLogs:
  enabled: true
  collector: alloy-logs
  journal:
    path: /var/log/journal
    maxAge: 8h
  structuredMetadata:
    transport: transport
  extraDiscoveryRules: |
    rule {
      action = "keep"
      source_labels = ["__journal_priority_keyword"]
      regex = "(emerg|alert|crit|err|warning)"
    }
applicationObservability:
  enabled: true
  receivers:
    otlp:
      includeDebugMetrics: true
      grpc:
        enabled: true
      http:
        enabled: true
  traces:
    transforms:
      span:
        - 'set(attributes["db.system.name"], attributes["db.system"]) where attributes["db.system.name"] == nil and attributes["db.system"] != nil'
        - 'set(attributes["db.operation.name"], attributes["db.operation"]) where attributes["db.operation.name"] == nil and attributes["db.operation"] != nil'
        - 'set(attributes["db.query.text"], attributes["db.statement"]) where attributes["db.query.text"] == nil and attributes["db.statement"] != nil'
        - 'replace_pattern(attributes["db.query.text"], "[\\r\\n\\t]+", " ") where attributes["db.query.text"] != nil'
        - 'replace_pattern(attributes["db.query.text"], " {2,}", " ") where attributes["db.query.text"] != nil'
        - 'replace_pattern(attributes["db.query.text"], "^ | $", "") where attributes["db.query.text"] != nil'
  collector: alloy-receiver
autoInstrumentation:
  enabled: true
  beyla:
    enabled: true
    deliverTracesToApplicationObservability: true
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - lm3h1
                    - lm3h2
                    - lm3h3
                    - rpi
    config:
      data:
        attributes:
          kubernetes:
            enable: true
        prometheus_export:
          features:
            - application
            - application_service_graph
            - application_span
            - application_host
        discovery:
          instrument:
            - k8s_namespace: app
            - k8s_namespace: auth
          exclude_instrument:
            - k8s_pod_labels:
                observability.nakatanakatana.app/otel-sdk: "true"
            - k8s_pod_labels:
                app: vcluster
            - exe_path: ".*litestream.*"
            - exe_path: ".*cloudflared.*"
        routes:
          unmatched: heuristic
          ignored_patterns:
            - /healthz
            - /readyz
            - /metrics
  collector: alloy-metrics
podLogsViaLoki:
  enabled: true
  extraDiscoveryRules: |
    rule {
      action = "labelmap"
      regex = "__meta_kubernetes_pod_label_(app)"
    }
  extraLogProcessingStages: |
    stage.match {
      selector = "{namespace=\"rook-ceph\"}"

      stage.drop {
        expression          = "beast: .* \"(GET|PUT|POST|HEAD|DELETE) .* HTTP/"
        drop_counter_reason = "rook_ceph_rgw_beast_access_log"
      }

      stage.drop {
        expression          = "log_channel\\(cluster\\) log \\[DBG\\] : pgmap"
        drop_counter_reason = "rook_ceph_mgr_pgmap_log"
      }

      stage.drop {
        expression          = "log_channel\\(audit\\) log \\[DBG\\] : .* cmd='mon_status'"
        drop_counter_reason = "rook_ceph_mon_mon_status_audit_log"
      }
    }
  collector: alloy-logs
annotationAutodiscovery:
  enabled: true
  annotations:
    scrape: prometheus.io/scrape
    metricsPath: prometheus.io/path
    metricsPortNumber: prometheus.io/port
    metricsScheme: prometheus.io/scheme
  metricsTuning:
    includeMetrics:
      - traefik_.*
    excludeMetrics:
      - go_.*
  collector: alloy-metrics
prometheusOperatorObjects:
  enabled: true
  serviceMonitors:
    enabled: true
  collector: alloy-metrics
integrations:
  alloy:
    instances:
      - name: alloy
        labelSelectors:
          app.kubernetes.io/name:
            - alloy-metrics
            - alloy-singleton
            - alloy-logs
            - alloy-receiver
        metrics:
          tuning:
            useDefaultAllowList: true
            includeMetrics:
              - alloy_build_info
  collector: alloy-metrics
