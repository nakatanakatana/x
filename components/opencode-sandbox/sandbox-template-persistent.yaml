apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: opencode-persistent
  namespace: sandbox
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: opencode-sandbox
        sandbox.nakatanakatana.app/template: opencode-persistent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: network
                    operator: NotIn
                    values:
                      - slow
      containers:
        - name: opencode
          image: ghcr.io/anomalyco/opencode:2.3.2@sha256:be07cc4afd6d668d91b77accf1bc4338c87b39fbacc0a61666eb003781015f5a
          command:
            - opencode
            - serve
            - --hostname
            - 0.0.0.0
            - --port
            - "4096"
          workingDir: /workspace
          ports:
            - name: http
              containerPort: 4096
          env:
            - name: HOME
              value: "/home/opencode"
            - name: HTTP_PROXY
              value: "http://egress-proxy.proxy.svc.cluster.local:3128"
            - name: HTTPS_PROXY
              value: "http://egress-proxy.proxy.svc.cluster.local:3128"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc,.cluster.local"
            - name: SSL_CERT_FILE
              value: "/etc/egress-proxy-ca/ca.crt"
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/egress-proxy-ca/ca.crt"
            - name: GIT_SSL_CAINFO
              value: "/etc/egress-proxy-ca/ca.crt"
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/egress-proxy-ca/ca.crt"
            - name: CURL_CA_BUNDLE
              value: "/etc/egress-proxy-ca/ca.crt"
            - name: OPENCODE_CONFIG
              value: "/etc/opencode/opencode.json"
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-server-auth
                  key: OPENCODE_SERVER_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4
              memory: 8Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: home
              mountPath: /home/opencode
            - name: opencode-config
              mountPath: /etc/opencode
              readOnly: true
            - name: egress-proxy-ca
              mountPath: /etc/egress-proxy-ca
              readOnly: true
      volumes:
        - name: home
          emptyDir:
            sizeLimit: 2Gi
        - name: opencode-config
          configMap:
            name: opencode-config
        - name: egress-proxy-ca
          secret:
            secretName: egress-proxy-ca-public
            items:
              - key: ca.crt
                path: ca.crt
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: rook-ceph-block
        resources:
          requests:
            storage: 20Gi
