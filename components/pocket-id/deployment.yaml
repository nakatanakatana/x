apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: auth
  labels:
    app: pocket-id
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocket-id
  template:
    metadata:
      annotations:
        litestream.mytools.nakatanakatana.app/inject: pocket-id-db
        litestream.mytools.nakatanakatana.app/target-container: pocket-id
        litestream.mytools.nakatanakatana.app/volume: data
      labels:
        app: pocket-id
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: network
                    operator: NotIn
                    values:
                      - slow
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v2.19.2@sha256:3ee23895d6a3adb5dd5de801a4fd31fc31b960e6dfbea9b5200e33cf477695eb
          ports:
            - containerPort: 1411
              name: http
          env:
            - name: APP_URL
              value: "https://id.nakatanakatana.app"
            - name: PORT
              value: "1411"
            - name: TRUST_PROXY
              value: "true"
            - name: PUID
              value: "65532"
            - name: PGID
              value: "65532"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secret
                  key: ENCRYPTION_KEY
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-id-data
