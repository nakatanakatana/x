apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-proxy-ingress
  namespace: proxy
spec:
  podSelector:
    matchLabels:
      app: egress-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox
      ports:
        - protocol: TCP
          port: 3128
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-sandbox-system
      ports:
        - protocol: TCP
          port: 3129
